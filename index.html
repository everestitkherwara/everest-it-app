        .nav-link { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 0; border-radius: 28px; background: transparent; color: #64748b; transition: all 0.3s ease; cursor: pointer; border: none; outline: none; }

        .nav-link:active:not(.active) { background: rgba(0,0,0,0.03); }

        /* EVEREST AI Styles */
        .everest-ai-fab {
            position: fixed; bottom: 100px; right: 20px; width: 65px; height: 65px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; cursor: pointer; z-index: 999;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); border: 2px solid white;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .everest-ai-fab:active { transform: scale(0.9) rotate(-5deg); }
        .everest-ai-fab .icon { width: 28px; height: 28px; }
        .everest-ai-fab span { font-size: 9px; font-weight: 900; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .everest-ai-chat-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 2000; display: none; flex-direction: column;
            animation: everest-ai-slideUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);

        @keyframes everest-ai-slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media (min-width: 480px) {

                width: 400px; height: 650px; border-radius: 30px;
                box-shadow: 0 15px 50px rgba(0,0,0,0.25); border: 1px solid #e2e8f0;

        .everest-ai-header {

        .everest-ai-header-info { display: flex; align-items: center; gap: 12px; }
        .everest-ai-header-info h4 { margin: 0; font-weight: 900; font-size: 18px; letter-spacing: -0.01em; }
        .everest-ai-header-info p { margin: 0; font-size: 10px; opacity: 0.9; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .everest-ai-messages { flex: 1; overflow-y: auto; padding: 20px; background: #f1f5f9; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }

        .everest-ai-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes everest-ai-bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .everest-ai-footer { padding: 16px; background: white; border-top: 1px solid #e2e8f0; border-bottom-left-radius: inherit; border-bottom-right-radius: inherit; }
        .everest-ai-quick-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

        .everest-ai-quick-btn:active { background: #e0f2fe; transform: translateY(-2px); }

        .everest-ai-input-wrap { display: flex; gap: 10px; align-items: center; }
        .everest-ai-input { flex: 1; border: 2px solid #f1f5f9; background: #f8fafc; padding: 14px 18px; border-radius: 16px; outline: none; font-weight: 700; font-size: 14px; transition: 0.2s; }
        .everest-ai-input:focus { border-color: #2563eb; background: white; }

            border-radius: 12px;

        .notebook-image-container {
            width: 100%;
            line-height: 0;
            background: #fff;

            display: flex;

            min-width: 0; /* Allow shrinking */

 y2='1150' stroke='%23e0e0e0'/><line x1='85' y1='0' x2='85' y2='1200' stroke='%23ffcccc' stroke-width='2'/><text x='400' y='30' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='18' fill='%231e40af'>EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text><text x='400' y='55' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='22' fill='%231e3a8a'>ARTIFICIAL INTELLIGENCE / AI</text><text x='400' y='78' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='16' fill='%231e40af'>मोबाइल: 9636049901</text><text x='100' y='130' font-family='cursive' font-weight='bold' font-size='24' fill='%23d32f2f'>Chapter 1: AI का परिचय (Introduction)</text><text x='100' y='165' font-family='cursive' font-size='18' fill='%23333'>AI का अर्थ है - 'Artificial Intelligence' (कृत्रिम बुद्धिमत्ता)।</text><text x='100' y='200' font-family='cursive' font-size='18' fill='%23333'>इसका मतलब है - मशीनों को इंसानों की तरह सोचने और</text><text x='100' y='235' font-family='cursive' font-size='18' fill='%23333'>निर्णय लेने के काबिल बनाना।</text><text x='100' y='305' font-family='cursive' font-weight='bold' font-size='20' fill='%231976d2'>AI के जनक (Father of AI):</text><text x='100' y='340' font-family='cursive' font-size='18' fill='%23333'>जॉन मैकार्थी (John McCarthy) को AI का जनक माना जाता है।</text><text x='100' y='375' font-family='cursive' font-size='18' fill='%23333'>इन्होंने 1956 में Dartmouth Workshop में यह नाम दिया था।</text><text x='100' y='445' font-family='cursive' font-weight='bold' font-size='20' fill='%23388e3c'>AI के प्रकार (Types of AI):</text><text x='110' y='480' font-family='cursive' font-size='18' fill='%23333'>1. Weak / Narrow AI (जैसे Google Assistant, Alexa)</text><text x='110' y='515' font-family='cursive' font-size='18' fill='%23333'>2. General AI (इंसानों के बराबर बुद्धि - अभी रिसर्च में है)</text><text x='110' y='550' font-family='cursive' font-size='18' fill='%23333'>3. Super AI (इंसानों से भी तेज - भविष्य की कल्पना)</text><text x='100' y='620' font-family='cursive' font-weight='bold' font-size='20' fill='%237b1fa2'>AI का महत्व:</text><text x='100' y='655' font-family='cursive' font-size='18' fill='%23333'>- समय की बचत</text><text x='100' y='690' font-family='cursive' font-size='18' fill='%23333'>- गलती होने की संभावना कम (Accuracy)</text><text x='100' y='725' font-family='cursive' font-size='18' fill='%23333'>- 24/7 काम करने की क्षमता</text><text x='100' y='760' font-family='cursive' font-size='18' fill='%23333'>- जटिल डेटा का विश्लेषण</text><circle cx='400' cy='950' r='100' fill='none' stroke='%231e3a8a' stroke-width='2'/><text x='400' y='955' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='20' fill='%231e3a8a'>AI</text><line x1='400' y1='850' x2='400' y2='800' stroke='%231e3a8a' stroke-width='2'/><text x='400' y='795' text-anchor='middle' font-family='cursive' font-size='14'>Healthcare</text><line x1='500' y1='950' x2='550' y2='950' stroke='%231e3a8a' stroke-width='2'/><text x='610' y='955' text-anchor='middle' font-family='cursive' font-size='14'>Education</text><line x1='300' y1='950' x2='250' y2='950' stroke='%231e3a8a' stroke-width='2'/><text x='190' y='955' text-anchor='middle' font-family='cursive' font-size='14'>Business</text><line x1='400' y1='1050' x2='400' y2='1100' stroke='%231e3a8a' stroke-width='2'/><text x='400' y='1120' text-anchor='middle' font-family='cursive' font-size='14'>Technology</text></svg>",

 y2='1150' stroke='%23e0e0e0'/><line x1='85' y1='0' x2='85' y2='1200' stroke='%23ffcccc' stroke-width='2'/><text x='400' y='30' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='18' fill='%231e40af'>EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text><text x='400' y='55' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='22' fill='%231e3a8a'>ARTIFICIAL INTELLIGENCE / AI</text><text x='100' y='130' font-family='cursive' font-weight='bold' font-size='24' fill='%23d32f2f'>AI का इतिहास (History of AI)</text><text x='100' y='165' font-family='cursive' font-size='18' fill='%23333'>● 1950: Alan Turing ने 'Turing Test' का प्रस्ताव दिया।</text><text x='100' y='200' font-family='cursive' font-size='18' fill='%23333'>● 1956: Dartmouth Workshop में AI शब्द का जन्म हुआ।</text><text x='100' y='235' font-family='cursive' font-size='18' fill='%23333'>● 1966: ELIZA (पहला Chatbot) बनाया गया।</text><text x='100' y='270' font-family='cursive' font-size='18' fill='%23333'>● 1997: IBM Deep Blue ने शतरंज में Garry Kasparov को हराया।</text><text x='100' y='305' font-family='cursive' font-size='18' fill='%23333'>● 2011: Apple ने 'Siri' लॉन्च किया।</text><text x='100' y='340' font-family='cursive' font-size='18' fill='%23333'>● 2022: OpenAI ने ChatGPT लॉन्च करके क्रांति ला दी।</text><text x='100' y='410' font-family='cursive' font-weight='bold' font-size='24' fill='%23d32f2f'>AI के उपयोग (Applications)</text><text x='100' y='445' font-family='cursive' font-size='18' fill='%23333'>1. Smart Assistants: Siri, Google Assistant, Alexa.</text><text x='100' y='480' font-family='cursive' font-size='18' fill='%23333'>2. Social Media: Instagram/FB पर Recommendations।</text><text x='100' y='515' font-family='cursive' font-size='18' fill='%23333'>3. Navigation: Google Maps पर रास्ता और ट्रैफिक बताना।</text><text x='100' y='550' font-family='cursive' font-size='18' fill='%23333'>4. E-commerce: Amazon/Flipkart पर प्रोडक्ट सुझाव।</text><text x='100' y='585' font-family='cursive' font-size='18' fill='%23333'>5. Healthcare: बीमारियों की पहचान और दवा रिसर्च।</text><text x='100' y='620' font-family='cursive' font-size='18' fill='%23333'>6. Finance: बैंक फ्रॉड पकड़ने और स्टॉक मार्केट।</text><rect x='100' y='700' width='600' height='150' fill='%23e3f2fd' stroke='%231e3a8a'/><text x='400' y='735' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='20' fill='%230d47a1'>Exam Point ⭐</text><text x='110' y='775' font-family='cursive' font-size='16' fill='%23333'>● दुनिया का पहला AI Robot 'Sophia' है जिसे सऊदी अरब की</text><text x='110' y='805' font-family='cursive' font-size='16' fill='%23333'>नागरिकता मिली है।</text><text x='110' y='835' font-family='cursive' font-size='16' fill='%23333'>● भारत का पहला AI सुपर कंप्यूटर 'PARAM SIDDHI' है।</text></svg>"
                ]},
                { id: 2, title: "Chapter 2: AI कैसे काम करता है", images: [
                    "data:image/svg+xml;utf8,<svg width='800' height='1200' xmlns='http://www.w3.org/2000/svg'><rect width='800' height='1200' fill='%23fffef2'/><line x1='0' y1='100' x2='800' y2='100' stroke='%23e0e0e0'/><line x1='0' y1='135' x2='800' y2='135' stroke='%23e0e0e0'/><line x1='0' y1='170' x2='800' y2='170' stroke='%23e0e0e0'/><line x1='0' y1='205' x2='800' y2='205' stroke='%23e0e0e0'/><line x1='0' y1='240' x2='800' y2='240' stroke='%23e0e0e0'/><line x1='85' y1='0' x2='85' y2='1200' stroke='%23ffcccc' stroke-width='2'/><text x='400' y='30' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='18' fill='%231e40af'>EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text><text x='400' y='55' text-anchor='middle' font-family='cursive' font-weight='bold' font-size='22' fill='%231e3a8a'>ARTIFICIAL INTELLIGENCE / AI</text><text x='100' y='130' font-family='cursive' font-weight='bold' font-size='24' fill='%23d32f2f'>Chapter 2: AI की कार्यप्रणाली (Working)</text><text x='100' y='165' font-family='cursive' font-size='18' fill='%23333'>AI के काम करने के 3 मुख्य आधार हैं:</text><text x='110' y='210' font-family='cursive' font-weight='bold' font-size='20' fill='%231e3a8a'>1. डेटा (Data) - 'AI का ईंधन':</text><text x='110' y='245' font-family='cursive' font-size='18' fill='%23333'>AI को सीखने के लिए विशाल डेटा की जरूरत होती है।</text><text x='110' y='280' font-family='cursive' font-size='18' fill='%23333'>डेटा टेक्स्ट, फोटो, वीडियो या आवाज कुछ भी हो सकता है।</text><text x='110' y='350' font-family='cursive' font-weight='bold' font-size='20' fill='%231e3a8a'>2. एल्गोरिथम (Algorithms):</text><text x='110' y='385' font-family='cursive' font-size='18' fill='%23333'>यह गणितीय नियमों का समूह है जो डेटा में पैटर्न ढूंढता है।</text><text x='110' y='455' font-family='cursive' font-weight='bold' font-size='20' fill='%231e3a8a'>3. कंप्यूटिंग पावर:</text><text x='110' y='490' font-family='cursive' font-size='18' fill='%23333'>AI को प्रोसेस करने के लिए शक्तिशाली GPU और Cloud</text><text x='110' y='525' font-family='cursive' font-size='18' fill='%23333'>सर्वर्स की जरूरत होती है।</text><path d='M150 650 L300 650 L300 600 L450 625 L300 650 L300 700 L450 675 L600 650' fill='none' stroke='%23333' stroke-width='2'/><rect x='100' y='625' width='100' height='50' fill='%23ffecb3' stroke='%23ff6f00'/><text x='150' y='655' text-anchor='middle' font-family='cursive' font-size='14'>Data</text><rect x='300' y='625' width='120' height='50' fill='%23c8e6c9' stroke='%232e7d32'/><text x='360' y='655' text-anchor='middle' font-family='cursive' font-size='14'>Algorithm</text><rect x='550' y='625' width='100' height='50' fill='%23f8bbd0' stroke='%23c2185b'/><text x='600' y='655' text-anchor='middle' font-family='cursive' font-size='14'>AI Output</text><text x='100' y='750' font-family='cursive' font-weight='bold' font-size='22' fill='%23d32f2f'>ट्रेनिंग (Training) क्या है?</text><text x='100' y='785' font-family='cursive' font-size='18' fill='%23333'>जब हम AI को लाखों उदाहरण (Images/Text) दिखाते हैं,</text><text x='100' y='820' font-family='cursive' font-size='18' fill='%23333'>तो वह उनके बीच के अंतर और पैटर्न को समझने लगता है।</text><text x='100' y='855' font-family='cursive' font-size='18' fill='%23333'>इसे ही 'Machine Learning' की ट्रेनिंग कहते हैं।</text><text x='100' y='930' font-family='cursive' font-weight='bold' font-size='22' fill='%23d32f2f'>टेस्टिंग (Testing):</text><text x='100' y='965' font-family='cursive' font-size='18' fill='%23333'>ट्रेनिंग के बाद AI से वह काम करवाया जाता है जो उसे सिखाया</text><text x='100' y='1000' font-family='cursive' font-size='18' fill='%23333'>गया है। अगर रिजल्ट सही है तो AI तैयार है!</text></svg>"
                ]},

                if(dir === 'next' && appState.notePage < pages.length - 1) {

                const questions = OLD_PAPERS_DATA[appState.activePaperDate];
                let s = appState.paperState;
                let correct = 0;
                let attempted = 0;
                questions.forEach((q, i) => {
                    if(s.answers[i] !== undefined) {
                        attempted++;
                        if(s.answers[i] === q.ans) correct++;
                    }
                });
                let wrong = attempted - correct;
                let unattempted = questions.length - attempted;
                let pct = Math.round((correct / questions.length) * 100);

                appState.paperState.results = {
                    total: questions.length,
                    attempted,
                    correct,
                    wrong,
                    unattempted,
                    score: correct,
                    percentage: pct,
                    date: appState.activePaperDate,
                    pass: correct >= 14
                };
                appState.paperState.submitted = true;
                render();
            },

            submitTest: () => {
                let s = appState.testState;
                let qs = s.activeTest.questions;
                let correct = 0;
                let attempted = 0;
                qs.forEach((q, i) => {
                    if(s.answers[i] !== undefined) {
                        attempted++;
                        if(s.answers[i] === q.a) correct++;
                    }
                });
                let wrong = attempted - correct;
                let pct = Math.round((correct / qs.length) * 100);
                let result = {
                    id: Date.now(),
                    studentName: appState.currentUser ? appState.currentUser.name : 'Guest User',
                    testTitle: s.activeTest.title,
                    date: new Date().toLocaleString('hi-IN'),
                    total: qs.length,
                    attempted: attempted,
                    correct: correct,
                    wrong: wrong,
                    score: correct,
                    percentage: pct,
                    pass: pct >= (db.settings.testSettings.passingPct || 40)

                    a: parseInt(form.correct.value)
                };

                appState.aiChat.messages.push({ role: 'user', text: text });

                render();

                const box = document.querySelector('.everest-ai-messages');

                    // Call the secure backend API (Gemini Proxy)

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: text })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.answer) {
                            appState.aiChat.messages.push({ role: 'bot', text: data.answer });
                            appState.aiChat.typing = false;
