<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive; font-weight: 700; }
      .branding { font-family: 'Arial', sans-serif; font-weight: 900; }
    </style>
    <filter id="handEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
  </defs>

  <!-- Notebook Base -->
  <rect width="800" height="1200" fill="#fffef7" />

  <!-- Ruled Lines -->
  <g stroke="#a5b4fc" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="85" y1="0" x2="85" y2="1200" stroke="#fca5a5" stroke-width="2" />
  <line x1="0" y1="115" x2="800" y2="115" stroke="#fca5a5" stroke-width="1.5" />

  <!-- Institutional Header -->
  <g transform="translate(30, 10)">
    <circle cx="50" cy="50" r="45" fill="white" stroke="#166534" stroke-width="2.5" />
    <text x="50" y="45" font-family="Arial" font-size="12" font-weight="900" fill="#166534" text-anchor="middle">EVEREST IT</text>
    <text x="50" y="65" font-family="Arial" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">ज्ञान केंद्र</text>

    <text x="350" y="40" class="branding" font-size="36" fill="#065f46" text-anchor="middle">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>
    <text x="350" y="65" font-family="Arial" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">TALLY PRIME &amp; ADVANCED ACCOUNTING</text>

    <rect x="620" y="5" width="120" height="70" rx="10" fill="none" stroke="#166534" stroke-width="1" />
    <text x="680" y="25" font-family="Arial" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">सीखें | बढ़ें | सफल बनें</text>
    <text x="680" y="55" font-family="Arial" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">9636049901</text>
  </g>

  <!-- Page Content Area -->
  <g transform="translate(100, 130)" filter="url(#handEffect)">
    <!-- Chapter Title -->
    <rect x="50" y="0" width="450" height="55" rx="27" fill="#dcfce7" stroke="#166534" stroke-width="2" />
    <text x="275" y="40" class="handwritten" font-size="30" fill="#166534" text-anchor="middle">Chapter 1 : Tally Prime परिचय</text>

    <!-- 1.1 Intro -->
    <g transform="translate(0, 80)">
       <rect x="-5" y="-18" width="550" height="32" fill="#ecfdf5" rx="5" />
       <text x="0" y="10" class="handwritten" font-size="26" fill="#065f46">1.1 Tally Prime क्या है? (What is Tally Prime?)</text>

       <text x="15" y="55" class="handwritten" font-size="22" fill="#1e293b">Tally Prime एक शक्तिशाली और लोकप्रिय एकाउंटिंग सॉफ्टवेयर</text>
       <text x="15" y="85" class="handwritten" font-size="22" fill="#1e293b">(Accounting Software) है, जिसका उपयोग व्यापार के वित्तीय</text>
       <text x="15" y="115" class="handwritten" font-size="22" fill="#1e293b">लेन-देन (Financial Transactions) को व्यवस्थित और सुरक्षित</text>
       <text x="15" y="145" class="handwritten" font-size="22" fill="#1e293b">रूप से रिकॉर्ड करने के लिए किया जाता है । यह बहुत सरल,</text>
       <text x="15" y="175" class="handwritten" font-size="22" fill="#1e293b">तेज और GST Compliant सॉफ्टवेयर है ।</text>
    </g>

    <!-- 1.2 Account Definition -->
    <g transform="translate(0, 290)">
       <rect x="-5" y="-18" width="550" height="32" fill="#fff7ed" rx="5" />
       <text x="0" y="10" class="handwritten" font-size="26" fill="#9a3412">1.2 एकाउंटिंग (Accounting) का अर्थ</text>
       <text x="15" y="55" class="handwritten" font-size="22" fill="#1e293b">व्यापार में होने वाले खर्चों, लाभ-हानि और लेन-देन का विधिवत</text>
       <text x="15" y="85" class="handwritten" font-size="22" fill="#1e293b">रिकॉर्ड रखना ही 'एकाउंटिंग' कहलाता है ।</text>
    </g>

    <!-- 1.3 Types of Accounts -->
    <g transform="translate(0, 460)">
       <rect x="-5" y="-18" width="580" height="32" fill="#f0fdf4" rx="5" />
       <text x="0" y="10" class="handwritten" font-size="26" fill="#15803d">1.3 खातों के प्रकार (Types of Accounts)</text>

       <g transform="translate(20, 70)">
          <!-- Personal -->
          <rect x="0" y="0" width="160" height="60" rx="10" fill="white" stroke="#2563eb" stroke-width="2" />
          <text x="80" y="30" class="handwritten" font-size="20" fill="#1e40af" text-anchor="middle">Personal Account</text>
          <text x="80" y="50" class="handwritten" font-size="11" fill="#64748b" text-anchor="middle">(व्यक्तिगत खाता)</text>

          <!-- Real -->
          <rect x="200" y="0" width="160" height="60" rx="10" fill="white" stroke="#ea580c" stroke-width="2" />
          <text x="280" y="30" class="handwritten" font-size="20" fill="#9a3412" text-anchor="middle">Real Account</text>
          <text x="280" y="50" class="handwritten" font-size="11" fill="#64748b" text-anchor="middle">(वास्तविक खाता)</text>

          <!-- Nominal -->
          <rect x="0" y="90" width="160" height="60" rx="10" fill="white" stroke="#9333ea" stroke-width="2" />
          <text x="80" y="120" class="handwritten" font-size="20" fill="#7e22ce" text-anchor="middle">Nominal Account</text>
          <text x="80" y="140" class="handwritten" font-size="11" fill="#64748b" text-anchor="middle">(नाममात्र खाता)</text>

          <!-- Tally -->
          <rect x="200" y="90" width="160" height="60" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2" />
          <text x="280" y="128" class="handwritten" font-size="22" fill="#854d0e" text-anchor="middle">Tally Prime</text>
       </g>
    </g>

    <!-- Example Box -->
    <g transform="translate(0, 740)">
       <path d="M0,0 L560,0 L560,160 L0,160 Z" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="10,5" />
       <text x="20" y="40" class="handwritten" font-size="24" fill="#1e293b">उदाहरण (Example) :-</text>
       <text x="30" y="80" class="handwritten" font-size="20" fill="#475569">यदि आपने ₹5000 का सामान खरीदा, तो उसकी एंट्री</text>
       <text x="30" y="115" class="handwritten" font-size="20" fill="#475569">Tally में 'Purchase Voucher' के माध्यम से की जाएगी ।</text>
    </g>

    <!-- Footer Quote -->
    <text x="280" y="1020" class="handwritten" font-size="22" font-weight="bold" fill="#059669" text-anchor="middle">"एक्यूरेट एकाउंटिंग, बिजनेस की तरक्की का आधार"</text>
  </g>

  <text x="100" y="1185" class="handwritten" font-size="20" fill="#475569">Page 1 / 4</text>
  <text x="700" y="1185" class="branding" font-size="12" fill="#166534" text-anchor="end">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>
</svg>