<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive; font-weight: 700; }
      .branding { font-family: 'Arial', sans-serif; font-weight: 900; }
    </style>
    <filter id="handEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
  </defs>

  <!-- Notebook Base -->
  <rect width="800" height="1200" fill="#fffef7" />

  <!-- Ruled Lines -->
  <g stroke="#a5b4fc" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="85" y1="0" x2="85" y2="1200" stroke="#fca5a5" stroke-width="2" />
  <line x1="0" y1="115" x2="800" y2="115" stroke="#fca5a5" stroke-width="1.5" />

  <!-- Institutional Header (Center Branding) -->
  <g transform="translate(30, 10)">
    <circle cx="50" cy="50" r="45" fill="white" stroke="#166534" stroke-width="2.5" />
    <text x="50" y="45" font-family="Arial" font-size="12" font-weight="900" fill="#166534" text-anchor="middle">EVEREST IT</text>
    <text x="50" y="65" font-family="Arial" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">ज्ञान केंद्र</text>

    <text x="350" y="40" class="branding" font-size="36" fill="#065f46" text-anchor="middle">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>
    <text x="350" y="65" font-family="Arial" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">TALLY PRIME &amp; ADVANCED ACCOUNTING</text>

    <rect x="620" y="5" width="120" height="70" rx="10" fill="none" stroke="#166534" stroke-width="1" />
    <text x="680" y="25" font-family="Arial" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">सीखें | बढ़ें | सफल बनें</text>
    <text x="680" y="55" font-family="Arial" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">9636049901</text>
  </g>

  <!-- Page Content Area -->
  <g transform="translate(100, 130)" filter="url(#handEffect)">
    <!-- Section Title -->
    <rect x="50" y="0" width="450" height="45" fill="#f0fdf4" rx="10" stroke="#166534" stroke-width="2" />
    <text x="275" y="32" class="handwritten" font-size="26" fill="#166534" text-anchor="middle">Groups &amp; Ledgers (ग्रुप और लेजर)</text>

    <!-- 1.4 Group -->
    <g transform="translate(0, 70)">
       <text x="0" y="10" class="handwritten" font-size="24" fill="#065f46">1.4 Group (ग्रुप) :-</text>
       <text x="15" y="45" class="handwritten" font-size="20" fill="#1e293b">समान स्वभाव वाले लेजरों के समूह को 'ग्रुप' कहा जाता है ।</text>
       <text x="15" y="75" class="handwritten" font-size="20" fill="#1e293b">Tally Prime में 28 Pre-defined Groups होते हैं ।</text>
       <text x="25" y="105" class="handwritten" font-size="18" fill="#475569">- Primary Groups: 15</text>
       <text x="25" y="130" class="handwritten" font-size="18" fill="#475569">- Sub-Groups: 13</text>
    </g>

    <!-- 1.5 Ledger (Increased translate Y to avoid overlap) -->
    <g transform="translate(0, 240)">
       <text x="0" y="10" class="handwritten" font-size="24" fill="#1e40af">1.5 Ledger (लेजर) :-</text>
       <text x="15" y="45" class="handwritten" font-size="20" fill="#1e293b">लेजर वह वास्तविक खाता है जिसमें एंट्री की जाती है ।</text>
       <text x="15" y="75" class="handwritten" font-size="20" fill="#1e293b">जैसे: Cash A/c, Capital A/c, Purchase A/c, Sales A/c.</text>
    </g>

    <!-- Table (Increased translate Y) -->
    <g transform="translate(0, 360)">
       <rect x="0" y="0" width="550" height="280" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5" />
       <line x1="0" y1="50" x2="550" y2="50" stroke="#94a3b8" stroke-width="1.5" />
       <line x1="250" y1="0" x2="250" y2="280" stroke="#94a3b8" stroke-width="1.5" />

       <text x="125" y="35" class="handwritten" font-size="22" fill="#1e293b" text-anchor="middle">Ledger Name</text>
       <text x="400" y="35" class="handwritten" font-size="22" fill="#1e293b" text-anchor="middle">Under Group</text>

       <text x="20" y="85" class="handwritten" font-size="20" fill="#475569">SBI Bank A/c</text>
       <text x="260" y="85" class="handwritten" font-size="20" fill="#475569">Bank Account</text>

       <text x="20" y="125" class="handwritten" font-size="20" fill="#475569">Rahul (Customer)</text>
       <text x="260" y="125" class="handwritten" font-size="20" fill="#475569">Sundry Debtors</text>

       <text x="20" y="165" class="handwritten" font-size="20" fill="#475569">Salary A/c</text>
       <text x="260" y="165" class="handwritten" font-size="20" fill="#475569">Indirect Expenses</text>

       <text x="20" y="205" class="handwritten" font-size="20" fill="#475569">Furniture A/c</text>
       <text x="260" y="205" class="handwritten" font-size="20" fill="#475569">Fixed Assets</text>

       <text x="20" y="245" class="handwritten" font-size="20" fill="#475569">Rent Paid</text>
       <text x="260" y="245" class="handwritten" font-size="20" fill="#475569">Indirect Expenses</text>
    </g>

    <!-- Pro Tip (Increased translate Y) -->
    <g transform="translate(0, 680)">
       <rect x="-5" y="-10" width="550" height="110" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
       <text x="20" y="30" class="handwritten" font-size="22" fill="#065f46">Tally Pro Tip :-</text>
       <text x="30" y="65" class="handwritten" font-size="18" fill="#064e3b">Tally में Cash और P&amp;L लेजर पहले से बने होते हैं,</text>
       <text x="30" y="90" class="handwritten" font-size="18" fill="#064e3b">इन्हें दोबारा बनाने की जरुरत नहीं होती ।</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="100" y="1185" class="handwritten" font-size="20" fill="#475569">Page 3 / 4</text>
  <text x="700" y="1185" class="branding" font-size="12" fill="#166534" text-anchor="end">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>
</svg>