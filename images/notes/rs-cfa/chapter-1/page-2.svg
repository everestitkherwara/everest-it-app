<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive; font-weight: 700; }
      .branding { font-family: 'Arial', sans-serif; font-weight: 900; }
    </style>
    <filter id="handEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
  </defs>

  <!-- Notebook Base -->
  <rect width="800" height="1200" fill="#fffef7" />

  <!-- Ruled Lines -->
  <g stroke="#a5b4fc" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="85" y1="0" x2="85" y2="1200" stroke="#fca5a5" stroke-width="2" />
  <line x1="0" y1="115" x2="800" y2="115" stroke="#fca5a5" stroke-width="1.5" />

  <!-- Institutional Header (Matches Page 1) -->
  <g transform="translate(30, 10)">
    <circle cx="50" cy="50" r="45" fill="white" stroke="#166534" stroke-width="2.5" />
    <text x="50" y="45" font-family="Arial" font-size="12" font-weight="900" fill="#166534" text-anchor="middle">EVEREST IT</text>
    <text x="50" y="65" font-family="Arial" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">ज्ञान केंद्र</text>

    <text x="350" y="40" class="branding" font-size="36" fill="#065f46" text-anchor="middle">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>
    <text x="350" y="65" font-family="Arial" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">TALLY PRIME &amp; ADVANCED ACCOUNTING</text>

    <rect x="620" y="5" width="120" height="70" rx="10" fill="none" stroke="#166534" stroke-width="1" />
    <text x="680" y="25" font-family="Arial" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">सीखें | बढ़ें | सफल बनें</text>
    <text x="680" y="55" font-family="Arial" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">9636049901</text>
  </g>

  <!-- Page Content Area -->
  <g transform="translate(100, 130)" filter="url(#handEffect)">
    <!-- Section Title (Matches Page 1 Title logic) -->
    <rect x="50" y="0" width="450" height="45" fill="#fef2f2" rx="10" stroke="#dc2626" stroke-width="2" />
    <text x="275" y="32" class="handwritten" font-size="24" fill="#991b1b" text-anchor="middle">Golden Rules of Accounting (एकाउंटिंग के नियम)</text>

    <!-- Rule 1 -->
    <g transform="translate(0, 80)">
       <text x="0" y="0" class="handwritten" font-size="24" fill="#1e40af">1. Personal Account (व्यक्तिगत खाता) :-</text>

       <text x="15" y="40" class="handwritten" font-size="20" fill="#1e293b">"पाने वाले को डेबिट (Debit) करो और</text>
       <text x="15" y="70" class="handwritten" font-size="20" fill="#1e293b">देने वाले को क्रेडिट (Credit) करो ।"</text>

       <rect x="25" y="90" width="400" height="40" rx="8" fill="#dbeafe" opacity="0.5" />
       <text x="35" y="117" class="handwritten" font-size="18" fill="#1e3a8a">Debit the Receiver | Credit the Giver</text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(0, 245)">
       <text x="0" y="0" class="handwritten" font-size="24" fill="#9a3412">2. Real Account (वास्तविक खाता) :-</text>

       <text x="15" y="40" class="handwritten" font-size="20" fill="#1e293b">"जो वस्तु व्यापार में आये उसे डेबिट करो,</text>
       <text x="15" y="70" class="handwritten" font-size="20" fill="#1e293b">जो वस्तु व्यापार से जाये उसे क्रेडिट करो ।"</text>

       <rect x="25" y="90" width="450" height="40" rx="8" fill="#fff7ed" opacity="0.6" />
       <text x="35" y="117" class="handwritten" font-size="18" fill="#9a3412">Debit what comes in | Credit what goes out</text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(0, 425)">
       <text x="0" y="0" class="handwritten" font-size="24" fill="#7e22ce">3. Nominal Account (नाममात्र खाता) :-</text>

       <text x="15" y="40" class="handwritten" font-size="20" fill="#1e293b">"सभी खर्चों और हानियों को डेबिट करो,</text>
       <text x="15" y="70" class="handwritten" font-size="20" fill="#1e293b">सभी आय और लाभ को क्रेडिट करो ।"</text>

       <rect x="25" y="90" width="450" height="40" rx="8" fill="#f3e8ff" opacity="0.6" />
       <text x="35" y="117" class="handwritten" font-size="18" fill="#6b21a8">Debit all Expenses &amp; Losses | Credit all Incomes &amp; Gains</text>
    </g>

    <!-- Highlights (Safe Area: width restricted to 550) -->
    <g transform="translate(0, 620)">
       <rect x="0" y="0" width="550" height="180" rx="20" fill="#fff9db" stroke="#eab308" stroke-width="2" />
       <text x="20" y="40" class="handwritten" font-size="24" fill="#854d0e">Important Points :-</text>
       <text x="40" y="80" class="handwritten" font-size="20" fill="#422006">● Debit को शार्ट में Dr. लिखते हैं ।</text>
       <text x="40" y="115" class="handwritten" font-size="20" fill="#422006">● Credit को शार्ट में Cr. लिखते हैं ।</text>
       <text x="40" y="150" class="handwritten" font-size="20" fill="#422006">● व्यापार की पूंजी (Capital) भी एक खाता है ।</text>
    </g>

    <!-- Diagram (Strictly centered in content area) -->
    <g transform="translate(50, 850)">
       <text x="175" y="-20" class="handwritten" font-size="22" fill="#334155" text-anchor="middle">Journal Entry Process</text>

       <circle cx="20" cy="50" r="45" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
       <text x="20" y="55" class="handwritten" font-size="16" fill="#1e40af" text-anchor="middle">Source Doc</text>

       <path d="M70,50 L120,50" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

       <circle cx="175" cy="50" r="45" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
       <text x="175" y="55" class="handwritten" font-size="16" fill="#166534" text-anchor="middle">Journal</text>

       <path d="M225,50 L275,50" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

       <circle cx="330" cy="50" r="45" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
       <text x="330" y="55" class="handwritten" font-size="16" fill="#9a3412" text-anchor="middle">Ledger</text>
    </g>
  </g>

  <!-- Footer (Matches Page 1) -->
  <text x="100" y="1185" class="handwritten" font-size="20" fill="#475569">Page 2 / 4</text>
  <text x="700" y="1185" class="branding" font-size="12" fill="#166534" text-anchor="end">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>