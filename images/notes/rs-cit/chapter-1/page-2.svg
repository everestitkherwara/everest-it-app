<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive; font-weight: 700; }
    </style>
    <filter id="inkEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <rect width="800" height="1200" fill="#fffef7" />
  <g stroke="#a5b4fc" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="85" y1="0" x2="85" y2="1200" stroke="#fca5a5" stroke-width="2.5" />

  <g transform="translate(100, 50)" filter="url(#inkEffect)">
    <rect x="-5" y="-12" width="600" height="30" fill="#fef08a" rx="5" />
    <text x="0" y="12" class="handwritten" font-size="28" fill="#854d0e">1.4 कम्प्यूटर के इनपुट एवं आउटपुट उपकरण (Devices)</text>

    <!-- Input Box -->
    <g transform="translate(10, 60)">
      <rect x="0" y="0" width="580" height="380" rx="20" fill="none" stroke="#2563eb" stroke-dasharray="8,4" stroke-width="2.5" />
      <rect x="20" y="-15" width="240" height="32" fill="#dbeafe" rx="10" />
      <text x="140" y="8" class="handwritten" font-size="22" fill="#1e40af" text-anchor="middle">Input Devices (इनपुट उपकरण)</text>

      <g transform="translate(30, 40)">
         <!-- Keyboard Sketch -->
         <g transform="translate(0, 0)">
            <rect x="0" y="10" width="130" height="65" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
            <path d="M5,20 L125,20 M5,35 L125,35 M5,50 L125,50" stroke="#334155" opacity="0.3" />
            <text x="65" y="100" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Keyboard</text>
         </g>
         <!-- Mouse Sketch -->
         <g transform="translate(155, 0)">
            <path d="M10,75 Q10,10 45,10 Q80,10 80,75 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
            <line x1="45" y1="10" x2="45" y2="40" stroke="#334155" stroke-width="1.5" />
            <text x="45" y="100" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Mouse</text>
         </g>
         <!-- Scanner Sketch -->
         <g transform="translate(265, 0)">
            <rect x="0" y="30" width="130" height="45" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
            <rect x="0" y="15" width="130" height="10" fill="#e2e8f0" stroke="#334155" transform="rotate(-12, 0, 30)" />
            <text x="65" y="100" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Scanner</text>
         </g>
         <!-- Microphone Sketch -->
         <g transform="translate(425, 10)">
            <circle cx="30" cy="30" r="25" fill="#334155" />
            <rect x="25" y="55" width="10" height="40" fill="#1e293b" />
            <text x="30" y="115" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Microphone</text>
         </g>
      </g>

      <text x="20" y="240" class="handwritten" font-size="22" fill="#1e293b">🔹 Keyboard में सामान्यतः <tspan fill="#dc2626">104 Keys</tspan> होती हैं ।</text>
      <text x="20" y="275" class="handwritten" font-size="22" fill="#1e293b">🔹 Mouse को <tspan fill="#dc2626">Pointing Device</tspan> भी कहा जाता है ।</text>
      <text x="20" y="310" class="handwritten" font-size="22" fill="#1e293b">🔹 Scanner कागज पर लिखे डेटा को <tspan fill="#16a34a">Digital</tspan> बनाता है ।</text>
    </g>

    <!-- Output Box -->
    <g transform="translate(10, 470)">
      <rect x="0" y="0" width="580" height="380" rx="20" fill="none" stroke="#16a34a" stroke-dasharray="8,4" stroke-width="2.5" />
      <rect x="20" y="-15" width="260" height="32" fill="#dcfce7" rx="10" />
      <text x="150" y="8" class="handwritten" font-size="22" fill="#15803d" text-anchor="middle">Output Devices (आउटपुट उपकरण)</text>

      <g transform="translate(30, 45)">
         <!-- Monitor Sketch -->
         <g transform="translate(0, 0)">
            <rect x="0" y="0" width="120" height="85" rx="5" fill="#f8fafc" stroke="#15803d" stroke-width="2" />
            <rect x="5" y="5" width="110" height="65" fill="#dbeafe" opacity="0.5" />
            <path d="M40,85 L80,85 L90,105 L30,105 Z" fill="#15803d" />
            <text x="60" y="130" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Monitor</text>
         </g>
         <!-- Printer Sketch -->
         <g transform="translate(160, 10)">
            <rect x="0" y="20" width="110" height="55" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
            <rect x="15" y="0" width="80" height="20" fill="white" stroke="#334155" />
            <rect x="15" y="70" width="80" height="15" fill="white" stroke="#334155" />
            <text x="55" y="115" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Printer</text>
         </g>
         <!-- Speaker Sketch -->
         <g transform="translate(310, 0)">
            <rect x="0" y="0" width="60" height="100" rx="8" fill="#1e293b" />
            <circle cx="30" cy="30" r="18" fill="none" stroke="#94a3b8" />
            <circle cx="30" cy="70" r="22" fill="none" stroke="#94a3b8" />
            <text x="30" y="130" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Speaker</text>
         </g>
         <!-- Projector Sketch -->
         <g transform="translate(420, 15)">
            <rect x="0" y="0" width="130" height="55" rx="5" fill="#334155" />
            <circle cx="100" cy="28" r="18" fill="#94a3b8" stroke="black" stroke-width="2" />
            <text x="65" y="105" class="handwritten" font-size="18" fill="#334155" text-anchor="middle">Projector</text>
         </g>
      </g>

      <text x="20" y="240" class="handwritten" font-size="22" fill="#1e293b">🔹 Monitor पर परिणाम <tspan fill="#2563eb">"Soft Copy"</tspan> कहलाता है ।</text>
      <text x="20" y="275" class="handwritten" font-size="22" fill="#1e293b">🔹 Printer से निकला कागज <tspan fill="#2563eb">"Hard Copy"</tspan> कहलाता है ।</text>
      <text x="20" y="310" class="handwritten" font-size="22" fill="#1e293b">🔹 Projector बड़ी स्क्रीन पर Display दिखाता है ।</text>
    </g>
  </g>

  <text x="400" y="1150" class="handwritten" font-size="20" font-weight="bold" fill="#475569" text-anchor="middle">Page 2 / 3</text>
  <text x="750" y="1185" font-family="Arial" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="end">EVEREST IT, Kherwara</text>
</svg>