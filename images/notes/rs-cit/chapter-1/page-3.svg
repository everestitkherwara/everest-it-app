<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive; font-weight: 700; }
    </style>
    <filter id="pencilEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" />
      <feDisplacementMap in="SourceGraphic" scale="2.5" />
    </filter>
  </defs>

  <rect width="800" height="1200" fill="#fffef7" />
  <g stroke="#a5b4fc" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="85" y1="0" x2="85" y2="1200" stroke="#fca5a5" stroke-width="2.5" />

  <g transform="translate(100, 50)" filter="url(#pencilEffect)">
    <!-- Hardware vs Software -->
    <rect x="-5" y="-12" width="550" height="30" fill="#fbcfe8" rx="5" />
    <text x="0" y="12" class="handwritten" font-size="28" fill="#be123c">1.5 Hardware vs Software (महत्वपूर्ण अंतर)</text>

    <g transform="translate(10, 60)">
       <rect x="0" y="0" width="580" height="240" rx="20" fill="white" stroke="#334155" stroke-width="2" />
       <line x1="290" y1="0" x2="290" y2="240" stroke="#334155" stroke-width="1.5" />
       <rect x="0" y="0" width="580" height="40" rx="15" fill="#f1f5f9" stroke="#334155" />
       <text x="145" y="28" class="handwritten" font-size="20" fill="#1e40af" text-anchor="middle">हार्डवेयर (Hardware)</text>
       <text x="435" y="28" class="handwritten" font-size="20" fill="#1e40af" text-anchor="middle">सॉफ्टवेयर (Software)</text>

       <text x="10" y="70" class="handwritten" font-size="18" fill="#334155">👉 ये भौतिक भाग हैं ।</text>
       <text x="300" y="70" class="handwritten" font-size="18" fill="#334155">👉 ये निर्देशों के समूह हैं ।</text>

       <text x="10" y="110" class="handwritten" font-size="18" fill="#334155">👉 देख व छू सकते हैं ।</text>
       <text x="300" y="110" class="handwritten" font-size="18" fill="#334155">👉 केवल देख सकते हैं (महसूस) ।</text>

       <text x="10" y="150" class="handwritten" font-size="18" fill="#334155">👉 शरीर की तरह ।</text>
       <text x="300" y="150" class="handwritten" font-size="18" fill="#334155">👉 आत्मा की तरह ।</text>

       <text x="10" y="190" class="handwritten" font-size="16" fill="#64748b">Ex: CPU, Mouse, RAM.</text>
       <text x="300" y="190" class="handwritten" font-size="16" fill="#64748b">Ex: Windows, Excel, Android.</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(10, 350)">
       <rect x="0" y="0" width="580" height="300" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
       <rect x="20" y="-15" width="280" height="32" fill="#d1fae5" rx="10" />
       <text x="160" y="8" class="handwritten" font-size="22" fill="#065f46" text-anchor="middle">कम्प्यूटर के प्रमुख गुण (Features)</text>

       <g transform="translate(30, 50)">
          <text x="0" y="0" class="handwritten" font-size="22" fill="#065f46">🚀 <tspan font-weight="bold">गति (Speed):</tspan> लाखों काम पल भर में ।</text>
          <text x="0" y="45" class="handwritten" font-size="22" fill="#065f46">🎯 <tspan font-weight="bold">शुद्धता (Accuracy):</tspan> 100% सही परिणाम ।</text>
          <text x="0" y="90" class="handwritten" font-size="22" fill="#065f46">📦 <tspan font-weight="bold">भंडारण (Storage):</tspan> डेटा को सालों सुरक्षित रखना।</text>
          <text x="0" y="135" class="handwritten" font-size="22" fill="#065f46">🔄 <tspan font-weight="bold">बहुमुखी (Versatility):</tspan> अनेक कार्य एक साथ ।</text>
          <text x="0" y="180" class="handwritten" font-size="22" fill="#065f46">🤝 <tspan font-weight="bold">निरंतरता (Diligence):</tspan> यह कभी थकता नहीं है ।</text>
       </g>
    </g>

    <!-- Summary Box -->
    <g transform="translate(10, 700)">
       <rect x="0" y="0" width="580" height="150" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
       <text x="30" y="40" class="handwritten" font-size="24" fill="#9a3412">Self Practice :-</text>
       <text x="50" y="85" class="handwritten" font-size="20" fill="#431407">Q. अपने घर में मौजूद 3 कम्प्यूटर उपकरणों</text>
       <text x="50" y="115" class="handwritten" font-size="20" fill="#431407">के नाम लिखिये और बताइए कि वे Input हैं</text>
       <text x="50" y="145" class="handwritten" font-size="20" fill="#431407">या Output ?</text>
    </g>
  </g>

  <text x="400" y="1150" class="handwritten" font-size="20" font-weight="bold" fill="#475569" text-anchor="middle">Page 3 / 3</text>
  <text x="750" y="1185" font-family="Arial" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="end">EVEREST IT ज्ञान केंद्र, खेरवाड़ा - 9636049901</text>
</svg>