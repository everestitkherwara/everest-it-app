<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .handwritten { font-family: 'Caveat', cursive; font-weight: 700; }
      .branding { font-family: 'Arial', sans-serif; font-weight: 900; }
    </style>
    <filter id="handEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
  </defs>
  <rect width="800" height="1200" fill="#fffef7" />
  <g stroke="#a5b4fc" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="85" y1="0" x2="85" y2="1200" stroke="#fca5a5" stroke-width="2" />
  <line x1="0" y1="115" x2="800" y2="115" stroke="#fca5a5" stroke-width="1.5" />
  <g transform="translate(30, 10)">
    <circle cx="50" cy="50" r="45" fill="white" stroke="#1e40af" stroke-width="2.5" />
    <text x="50" y="45" font-family="Arial" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">EVEREST IT</text>
    <text x="50" y="65" font-family="Arial" font-size="14" font-weight="900" fill="#1e40af" text-anchor="middle">ज्ञान केंद्र</text>
    <text x="380" y="40" class="branding" font-size="42" fill="#1e3a8a" text-anchor="middle">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>
    <text x="380" y="65" font-family="Arial" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">COMPUTER EDUCATION FOR A BRIGHT FUTURE</text>
    <rect x="640" y="5" width="130" height="70" rx="10" fill="none" stroke="#1e40af" stroke-width="1" />
    <text x="705" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">सीखें | बढ़ें | सफल बनें</text>
    <text x="705" y="55" font-family="Arial" font-size="16" font-weight="900" fill="#1e40af" text-anchor="middle">9636049901</text>
  </g>
  <g transform="translate(100, 130)" filter="url(#handEffect)">
    <g transform="translate(0, 0)">
       <rect x="-5" y="-18" width="550" height="32" fill="#dcfce7" rx="5" />
       <text x="0" y="10" class="handwritten" font-size="28" fill="#166534">6.3 एनिमेशन और ट्रांजिशन (Difference)</text>
       <g transform="translate(20, 55)">
          <text x="0" y="0" class="handwritten" font-size="24" fill="#334155">① <tspan fill="#2563eb" font-weight="bold">Transition:</tspan></text>
          <text x="25" y="35" class="handwritten" font-size="20" fill="#475569">एक स्लाइड से दूसरी स्लाइड पर जाने का प्रभाव ।</text>
          <text x="0" y="85" class="handwritten" font-size="24" fill="#334155">② <tspan fill="#ea580c" font-weight="bold">Animation:</tspan></text>
          <text x="25" y="120" class="handwritten" font-size="20" fill="#475569">स्लाइड के अंदर के ऑब्जेक्ट्स (Text/Images) पर प्रभाव ।</text>
       </g>
    </g>
    <g transform="translate(0, 320)">
       <rect x="-5" y="-18" width="550" height="32" fill="#fee2e2" rx="5" />
       <text x="0" y="10" class="handwritten" font-size="28" fill="#991b1b">6.4 स्लाइड शो शॉर्टकट्स (Slide Show Keys)</text>
       <g transform="translate(20, 55)">
          <text x="0" y="0" class="handwritten" font-size="22" fill="#334155">● <tspan font-weight="bold">F5 :</tspan> पहली स्लाइड से शुरू करना ।</text>
          <text x="0" y="40" class="handwritten" font-size="22" fill="#334155">● <tspan font-weight="bold">Shift + F5 :</tspan> वर्तमान स्लाइड से शुरू करना ।</text>
          <text x="0" y="80" class="handwritten" font-size="22" fill="#334155">● <tspan font-weight="bold">Esc :</tspan> स्लाइड शो बंद करना ।</text>
       </g>
    </g>
    <g transform="translate(50, 580)">
       <rect x="0" y="0" width="500" height="150" rx="20" fill="#fef9c3" stroke="#eab308" stroke-width="2" />
       <text x="250" y="40" class="handwritten" font-size="26" fill="#854d0e" text-anchor="middle">Note :-</text>
       <text x="250" y="80" class="handwritten" font-size="20" fill="#1e293b" text-anchor="middle">Slide Master का उपयोग सभी स्लाइड्स पर</text>
       <text x="250" y="110" class="handwritten" font-size="20" fill="#1e293b" text-anchor="middle">समान लोगो या शीर्षक लगाने के लिए होता है ।</text>
    </g>
  </g>
  <text x="100" y="1185" class="handwritten" font-size="22" fill="#475569">Page 2 / 2</text>
  <text x="750" y="1185" class="branding" font-size="14" fill="#1e40af" text-anchor="end">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>
</svg>