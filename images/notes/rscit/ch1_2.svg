<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1200" fill="#fffef5" />
  <g stroke="#94a3b8" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="80" y1="0" x2="80" y2="1200" stroke="#f87171" stroke-width="2" opacity="0.6" />
  <text x="400" y="30" font-family="sans-serif" font-size="14" font-weight="900" fill="#64748b" text-anchor="middle">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>

  <g transform="rotate(0.3, 400, 600)">
    <text x="100" y="110" font-family="cursive" font-size="28" font-weight="bold" fill="#dc2626">Hardware vs Software</text>

    <text x="100" y="195" font-family="cursive" font-size="22" font-weight="bold" fill="#1d4ed8">1. Hardware (हार्डवेयर):</text>
    <text x="120" y="235" font-family="cursive" font-size="20" fill="#1e40af">कम्प्यूटर के वे भौतिक भाग जिन्हें हम देख सकते हैं</text>
    <text x="120" y="275" font-family="cursive" font-size="20" fill="#1e40af">और छू सकते हैं, हार्डवेयर कहलाते हैं।</text>
    <text x="120" y="315" font-family="cursive" font-size="20" fill="#1e40af">उदा: Keyboard, Mouse, CPU, Monitor, Printer.</text>

    <text x="100" y="435" font-family="cursive" font-size="22" font-weight="bold" fill="#1d4ed8">2. Software (सॉफ्टवेयर):</text>
    <text x="120" y="475" font-family="cursive" font-size="20" fill="#1e40af">निर्देशों या प्रोग्रामों का वह समूह जो हार्डवेयर को</text>
    <text x="120" y="515" font-family="cursive" font-size="20" fill="#1e40af">बताता है कि क्या करना है। इन्हें हम छू नहीं सकते।</text>
    <text x="120" y="555" font-family="cursive" font-size="20" fill="#1e40af">उदा: Windows 10, MS Word, Photoshop, Android.</text>

    <text x="100" y="675" font-family="cursive" font-size="24" font-weight="bold" fill="#dc2626">Software के प्रकार:</text>
    <text x="120" y="715" font-family="cursive" font-size="20" fill="#1e40af">A. System Software: कम्प्यूटर को संचालित करता है।</text>
    <text x="145" y="755" font-family="cursive" font-size="18" fill="#1e40af">(Ex: Operating System)</text>
    <text x="120" y="835" font-family="cursive" font-size="20" fill="#1e40af">B. Application Software: विशेष कार्यों के लिए।</text>
    <text x="145" y="875" font-family="cursive" font-size="18" fill="#1e40af">(Ex: WhatsApp, Browser)</text>
  </g>
  <text x="750" y="1180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="end">Page 02</text>
</svg>