<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1200" fill="#fffef5" />
  <g stroke="#94a3b8" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" /><line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="120" x2="800" y2="120" /><line x1="0" y1="160" x2="800" y2="160" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="280" x2="800" y2="280" /><line x1="0" y1="320" x2="800" y2="320" /><line x1="0" y1="360" x2="800" y2="360" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="440" x2="800" y2="440" /><line x1="0" y1="480" x2="800" y2="480" /><line x1="0" y1="520" x2="800" y2="520" /><line x1="0" y1="560" x2="800" y2="560" /><line x1="0" y1="600" x2="800" y2="600" /><line x1="0" y1="640" x2="800" y2="640" /><line x1="0" y1="680" x2="800" y2="680" /><line x1="0" y1="720" x2="800" y2="720" /><line x1="0" y1="760" x2="800" y2="760" /><line x1="0" y1="800" x2="800" y2="800" /><line x1="0" y1="840" x2="800" y2="840" /><line x1="0" y1="880" x2="800" y2="880" /><line x1="0" y1="920" x2="800" y2="920" /><line x1="0" y1="960" x2="800" y2="960" /><line x1="0" y1="1000" x2="800" y2="1000" /><line x1="0" y1="1040" x2="800" y2="1040" /><line x1="0" y1="1080" x2="800" y2="1080" /><line x1="0" y1="1120" x2="800" y2="1120" /><line x1="0" y1="1160" x2="800" y2="1160" />
  </g>
  <line x1="80" y1="0" x2="80" y2="1200" stroke="#f87171" stroke-width="2" opacity="0.6" />
  <text x="400" y="30" font-family="sans-serif" font-size="14" font-weight="900" fill="#64748b" text-anchor="middle">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>

  <g transform="rotate(-0.2, 400, 600)">
    <text x="100" y="110" font-family="cursive" font-size="28" font-weight="bold" fill="#dc2626">CPU &amp; Memory</text>

    <text x="100" y="195" font-family="cursive" font-size="22" font-weight="bold" fill="#1d4ed8">1. CPU (Central Processing Unit):</text>
    <text x="120" y="235" font-family="cursive" font-size="20" fill="#1e40af">इसे कम्प्यूटर का 'मस्तिष्क' (Brain) कहते हैं।</text>
    <text x="120" y="275" font-family="cursive" font-size="20" fill="#1e40af">मुख्य भाग: ALU (Maths) और CU (Control).</text>

    <text x="100" y="395" font-family="cursive" font-size="22" font-weight="bold" fill="#1d4ed8">2. Memory (मेमोरी):</text>
    <text x="120" y="435" font-family="cursive" font-size="20" fill="#1e40af">A. Primary Memory:</text>
    <text x="145" y="475" font-family="cursive" font-size="18" fill="#1e40af">- RAM: अस्थाई (Temporary)</text>
    <text x="145" y="515" font-family="cursive" font-size="18" fill="#1e40af">- ROM: स्थाई (Permanent)</text>

    <text x="120" y="595" font-family="cursive" font-size="20" fill="#1e40af">B. Secondary Memory:</text>
    <text x="145" y="635" font-family="cursive" font-size="18" fill="#1e40af">- Hard Disk, Pen Drive, SD Card.</text>

    <text x="100" y="755" font-family="cursive" font-size="24" font-weight="bold" fill="#dc2626">Input/Output Devices:</text>
    <text x="120" y="795" font-family="cursive" font-size="20" fill="#1e40af">Input: Keyboard, Mouse, Scanner.</text>
    <text x="120" y="835" font-family="cursive" font-size="20" fill="#1e40af">Output: Monitor, Printer, Speaker.</text>
  </g>
  <text x="750" y="1180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="end">Page 03</text>
</svg>