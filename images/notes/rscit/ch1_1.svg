<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper Background -->
  <rect width="800" height="1200" fill="#fffef5" />

  <!-- Hole Punch Effect -->
  <circle cx="25" cy="100" r="10" fill="#f1f5f9" stroke="#e2e8f0" />
  <circle cx="25" cy="600" r="10" fill="#f1f5f9" stroke="#e2e8f0" />
  <circle cx="25" cy="1100" r="10" fill="#f1f5f9" stroke="#e2e8f0" />

  <!-- Horizontal Ruled Lines -->
  <g stroke="#94a3b8" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="440" x2="800" y2="440" />
    <line x1="0" y1="480" x2="800" y2="480" />
    <line x1="0" y1="520" x2="800" y2="520" />
    <line x1="0" y1="560" x2="800" y2="560" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="640" x2="800" y2="640" />
    <line x1="0" y1="680" x2="800" y2="680" />
    <line x1="0" y1="720" x2="800" y2="720" />
    <line x1="0" y1="760" x2="800" y2="760" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="0" y1="840" x2="800" y2="840" />
    <line x1="0" y1="880" x2="800" y2="880" />
    <line x1="0" y1="920" x2="800" y2="920" />
    <line x1="0" y1="960" x2="800" y2="960" />
    <line x1="0" y1="1000" x2="800" y2="1000" />
    <line x1="0" y1="1040" x2="800" y2="1040" />
    <line x1="0" y1="1080" x2="800" y2="1080" />
    <line x1="0" y1="1120" x2="800" y2="1120" />
    <line x1="0" y1="1160" x2="800" y2="1160" />
  </g>

  <!-- Vertical Margin -->
  <line x1="80" y1="0" x2="80" y2="1200" stroke="#f87171" stroke-width="2" opacity="0.6" />

  <!-- Branding Heading -->
  <text x="400" y="30" font-family="sans-serif" font-size="14" font-weight="900" fill="#64748b" text-anchor="middle" letter-spacing="1">EVEREST IT ज्ञान केंद्र, खेरवाड़ा</text>

  <!-- Handwritten Content -->
  <g transform="rotate(-0.5, 400, 600)">
    <!-- Chapter Title -->
    <text x="100" y="110" font-family="cursive" font-size="34" font-weight="bold" fill="#dc2626">Chapter 1: कम्प्यूटर का परिचय</text>
    <line x1="100" y1="120" x2="520" y2="120" stroke="#dc2626" stroke-width="2" />

    <text x="100" y="195" font-family="cursive" font-size="26" font-weight="bold" fill="#1d4ed8">1. कम्प्यूटर क्या है? (What is Computer?)</text>

    <text x="100" y="275" font-family="cursive" font-size="22" fill="#1e40af">कम्प्यूटर शब्द की उत्पत्ति लैटिन भाषा के 'Computare'</text>
    <text x="100" y="315" font-family="cursive" font-size="22" fill="#1e40af">शब्द से हुई है, जिसका अर्थ है - "गणना करना" ।</text>

    <text x="100" y="395" font-family="cursive" font-size="22" fill="#1e40af">यह एक Electronic Device है जो User से Data (Input)</text>
    <text x="100" y="435" font-family="cursive" font-size="22" fill="#1e40af">लेकर उसे निर्देशों के अनुसार Process करता है और</text>
    <text x="100" y="475" font-family="cursive" font-size="22" fill="#1e40af">हमें सार्थक परिणाम (Output) प्रदान करता है ।</text>

    <text x="100" y="555" font-family="cursive" font-size="26" font-weight="bold" fill="#dc2626">मुख्य विशेषताएँ (Characteristics):</text>

    <text x="120" y="635" font-family="cursive" font-size="22" fill="#1e40af">🚀 Speed (गति): यह लाखों गणनाएँ 1 सेकंड में कर सकता है।</text>
    <text x="120" y="715" font-family="cursive" font-size="22" fill="#1e40af">🎯 Accuracy (शुद्धता): यह बिना किसी गलती के 100%</text>
    <text x="145" y="755" font-family="cursive" font-size="22" fill="#1e40af">सटीक परिणाम देता है।</text>

    <text x="120" y="835" font-family="cursive" font-size="22" fill="#1e40af">📦 Storage (भंडारण): डेटा को सालों तक सुरक्षित रख सकता है।</text>

    <text x="100" y="955" font-family="cursive" font-size="22" fill="#1e40af" font-style="italic">* कम्प्यूटर में स्वयं की कोई बुद्धि (No IQ) नहीं होती ।</text>
    <text x="100" y="995" font-family="cursive" font-size="22" fill="#1e40af" font-style="italic">* यह थकता नहीं है (Diligence) ।</text>
  </g>

  <!-- Page Footer -->
  <text x="750" y="1180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="end">Page 01</text>
</svg>